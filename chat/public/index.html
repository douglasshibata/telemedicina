<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="chat">
        <input type="text" name="username" placeholder="Digite o seu Usuário">
        <div class="messages"></div>
        <input type="text" name="message" placeholder="Digite a sua mensagem">
        <button type="submit">Enviar</button>
    </form>
    <script type="text/javascript">
        var socket = io(window.location.origin);
        function renderMessage(message) {
            // Prevent XSS by building text nodes securely rather than raw string injection
            var $author = $('<strong>').text(message.author);
            var $msgDiv = $('<div class="message"></div>')
                .append($author)
                .append(': ')
                .append(document.createTextNode(message.message));
            $('.messages').append($msgDiv);
        }
        socket.on('previousMessage', function(messages) {
            if (Array.isArray(messages)) {
                for (var i = 0; i < messages.length; i++) {
                    renderMessage(messages[i]);
                }
            }
        });
        socket.on('receivedMessage', function(message) {
            renderMessage(message);
        });
        $('#chat').submit(function(event) {
            event.preventDefault();
            var author = $.trim($('input[name=username]').val());
            var message = $.trim($('input[name=message]').val());
            if (author.length && message.length) {
                var messageObject = {
                    author: author,
                    message: message
                };
                renderMessage(messageObject);
                socket.emit('sendMessage', messageObject);
                $('input[name=message]').val('');
            }
        });
    </script>
</body>

</html>
